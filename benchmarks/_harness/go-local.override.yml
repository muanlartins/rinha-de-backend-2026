# LOCAL-ONLY override for benchmarking on Apple Silicon.
#
# The references.json.gz is now baked into the image at /resources/, so no
# volume mount is needed (and the rinha test env doesn't mount it either).
# Only the HAProxy memory bump remains: under Rosetta x86 emulation the haproxy
# binary's JIT translation cache pushes RSS past 15 MB and the worker gets
# OOM-killed mid-test. The actual Mac Mini Late 2014 test env (native amd64)
# stays inside the 15 MB official limit.
services:
  lb:
    deploy:
      resources:
        limits:
          memory: 64MB
