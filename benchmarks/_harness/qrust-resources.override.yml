# LOCAL-ONLY override for benchmarking QRust on Apple Silicon hosts.
#
# Two things this changes vs the upstream qrust compose:
#   1. Adds the /resources bind mount to api-1 and api-2 so prepare.ts can find
#      references.json.gz at startup (the upstream compose assumes the test
#      runner mounts /resources externally).
#   2. Bumps HAProxy memory from 15 MB to 64 MB. Under Rosetta x86 emulation
#      on Apple Silicon, the haproxy binary has ~3-4x memory overhead from
#      the JIT translation cache; at 15 MB the worker gets OOM-killed mid-test
#      with exit code 137. The actual submission environment (Mac Mini Late
#      2014, native amd64) keeps the official 15 MB.
#
# Usage:
#   docker compose \
#     -f references/qrust-luanmonteiro/docker-compose.yml \
#     -f benchmarks/_harness/qrust-resources.override.yml \
#     up -d
services:
  api-1:
    platform: linux/amd64
    volumes:
      - /Users/muanlartins/repos/rinha-de-backend-2026/references/rinha-official/resources:/resources:ro

  api-2:
    platform: linux/amd64
    volumes:
      - /Users/muanlartins/repos/rinha-de-backend-2026/references/rinha-official/resources:/resources:ro

  lb:
    platform: linux/amd64
    deploy:
      resources:
        limits:
          memory: 64MB
