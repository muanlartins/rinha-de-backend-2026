services:
  api-1:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-1
    environment:
      - API_SOCKET=/var/run/rinha/api1.sock
      - SHED_SLOTS=4
      - SHED_TIMEOUT_MS=3
    volumes:
      - socket-dir:/var/run/rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"

  api-2:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-2
    environment:
      - API_SOCKET=/var/run/rinha/api2.sock
      - SHED_SLOTS=4
      - SHED_TIMEOUT_MS=3
    volumes:
      - socket-dir:/var/run/rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"

  lb:
    image: haproxy:3.0-alpine
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-lb
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - socket-dir:/var/run/rinha
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"

volumes:
  socket-dir: {}
