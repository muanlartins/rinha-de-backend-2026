services:
  api-1:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-1
    environment:
      - API_SOCKET=/var/run/rinha/api1.sock
      - API_CTRL_SOCKET=/var/run/rinha/api1.sock.ctrl
      - SHED_SLOTS=4
      - SHED_TIMEOUT_MS=3
    volumes:
      - socket-dir:/var/run/rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  api-2:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-2
    environment:
      - API_SOCKET=/var/run/rinha/api2.sock
      - API_CTRL_SOCKET=/var/run/rinha/api2.sock.ctrl
      - SHED_SLOTS=4
      - SHED_TIMEOUT_MS=3
    volumes:
      - socket-dir:/var/run/rinha
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  lb:
    image: jrblatt/so-no-forevis:v1.0.0
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-lb
    environment:
      UPSTREAMS: /var/run/rinha/api1.sock,/var/run/rinha/api2.sock
      PORT: "9999"
      BUF_SIZE: "4096"
      WORKERS: "1"
    volumes:
      - socket-dir:/var/run/rinha
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30MB"

volumes:
  socket-dir: {}
