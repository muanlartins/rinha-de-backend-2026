services:
  api-1:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-1
    environment:
      - API_SOCKET=/var/run/rinha/api1.sock
    volumes:
      - socket-dir:/var/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "164MB"

  api-2:
    image: muanlartins/rinha-de-backend-2026:latest
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-api-2
    environment:
      - API_SOCKET=/var/run/rinha/api2.sock
    volumes:
      - socket-dir:/var/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "164MB"

  lb:
    image: haproxy:3.0-alpine
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-lb
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - socket-dir:/var/run/rinha
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"

  warmup:
    image: curlimages/curl:8.10.1
    pull_policy: always
    platform: linux/amd64
    container_name: rinha-go-warmup
    entrypoint: ["/bin/sh", "/warmup.sh"]
    environment:
      - BASE_URL=http://lb:9999
      - READY_RETRIES=240
      - READY_SLEEP=0.25
      - WARMUP_ROUNDS=120
    volumes:
      - ./scripts/warmup.sh:/warmup.sh:ro
    depends_on:
      - lb
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "6MB"

volumes:
  socket-dir: {}
